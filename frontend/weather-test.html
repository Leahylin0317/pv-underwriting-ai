<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>气象接口测试</title>
<style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#20362c;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}header{padding:18px 28px;background:#173c31;color:white;display:flex;justify-content:space-between}header a{color:#e7eee7}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}p{margin:0 0 18px}.muted{color:#65776c}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px}.panel{background:white;border:1px solid #d5dfd6;border-radius:8px;padding:22px}label{display:block;margin:13px 0 4px}input,select,button{font:inherit;border:1px solid #becfc3;border-radius:5px;padding:9px 11px}input,select{width:100%;background:white;color:inherit}button{cursor:pointer;background:white;color:#215b42}button.primary{background:#215b42;color:white;border-color:#215b42;width:100%;margin-top:20px}button:disabled{opacity:.5;cursor:wait}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.message{margin:18px 0;padding:12px 15px;border-left:3px solid #698d76;background:#e9efe8}.error{color:#9d3528;background:#fff0eb;border-color:#b35d4c}[hidden]{display:none!important}.tablewrap{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid #e1e7e0;font-variant-numeric:tabular-nums}th{position:sticky;top:0;background:#f0f4ee;color:#56705e}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f2;padding:16px;max-height:350px;overflow:auto;font-size:12px}summary{cursor:pointer;margin-top:18px}.toolbar{display:flex;gap:10px;margin:18px 0}.empty{padding:70px 15px;text-align:center;color:#697c6d}.meta{line-height:1.9;margin-bottom:16px;overflow-wrap:anywhere}.hint{font-size:12px;color:#687b6c;margin-top:8px}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #8db49a;outline-offset:2px}@media(max-width:800px){main{padding:16px}.layout{grid-template-columns:1fr}header{padding:15px}.panel{padding:18px}}
</style></head>
<body><header><strong>光伏核保 · 气象接口测试</strong><a href="/evaluation">返回材料测试</a></header>
<main><h1>查询所在地历史气象</h1><p class="muted">输入地址或 WGS84 经纬度，查看风、雨、雪及数据完整性。</p>
<div class="layout"><section class="panel"><h2>查询条件</h2><form id="queryForm">
<label for="mode">定位方式</label><select id="mode"><option value="coordinates">经纬度（WGS84）</option><option value="address">详细地址</option></select>
<div id="coordinateFields" class="pair"><div><label for="longitude">经度</label><input id="longitude" type="number" step="any" min="-180" max="180" value="116.06" required></div><div><label for="latitude">纬度</label><input id="latitude" type="number" step="any" min="-90" max="90" value="36.24" required></div></div>
<div id="addressFields" hidden><label for="address">详细地址</label><input id="address" placeholder="省、市、区县、道路和门牌号"><label for="city">城市（可选）</label><input id="city" placeholder="用于减少同名地址歧义"><div class="hint">地址查询需要服务端已配置高德密钥。</div></div>
<div class="pair"><div><label for="start">开始日期</label><input id="start" type="date" value="2024-01-01" required></div><div><label for="end">结束日期</label><input id="end" type="date" value="2024-01-07" required></div></div>
<label for="resolution">结果粒度</label><select id="resolution"><option value="daily">逐日汇总</option><option value="hourly">逐时数据</option><option value="yearly">逐年汇总</option></select><div class="hint">单次最多 366 天。长时段请按年查询。</div>
<details><summary>认证（已启用登录时填写）</summary><label for="token">Bearer Token</label><input id="token" type="password" autocomplete="off" placeholder="仅保留在当前页面"></details>
<button type="submit" id="submit" class="primary">查询气象数据</button><button type="button" id="example" style="width:100%;margin-top:10px">恢复示例查询</button></form></section>
<section class="panel"><h2>查询结果</h2><div id="status" role="status" class="message">示例坐标仅用于测试。点击查询获取真实接口响应。</div><label for="history">已保存的查询记录（刷新后仍可查看）</label><select id="history"><option value="">尚无查询记录</option></select><div id="result" hidden><div id="meta" class="meta"></div><div class="toolbar"><button id="download">下载 JSON</button><span id="rowCount" class="muted"></span></div><div id="table" class="tablewrap"></div><details><summary>原始响应 JSON</summary><pre id="raw"></pre></details></div><div id="empty" class="empty">尚未查询</div><details><summary>查看本次请求</summary><pre id="request">POST /api/v1/weather/history</pre></details><p class="hint" style="margin-top:22px">地面积雪深度不等于屋顶雪荷载。冰雹目前无可信事件数据源，将返回未取得；阵风数据的来源口径仍需核实。</p></section></div></main>
<script>
const $=id=>document.getElementById(id);let current=null;
const labels={time:'时间',date:'日期',period:'时段',hours:'记录小时',wind_speed_10m:'风速 m/s',wind_gusts_10m:'阵风 m/s',wind_direction_10m:'风向 °',temperature_2m:'气温 °C',surface_pressure:'地面气压 hPa',precipitation:'总降水 mm',rain:'降雨 mm',snowfall:'降雪 cm',snow_depth:'地面积雪 m',wind_speed_10m_max:'最大风速 m/s',wind_gusts_10m_max:'最大阵风 m/s',wind_gusts_10m_valid_hours:'阵风有效小时',temperature_2m_min:'最低气温 °C',temperature_2m_max:'最高气温 °C',surface_pressure_mean:'平均气压 hPa',precipitation_sum:'累计降水 mm',rain_sum:'累计降雨 mm',snowfall_sum:'累计降雪 cm',ground_snow_depth_max:'最大积雪 m'};
function mode(){const address=$('mode').value==='address';$('addressFields').hidden=!address;$('coordinateFields').hidden=address;$('address').required=address;for(const id of ['longitude','latitude'])$(id).required=!address;}
function payload(){const p={start_date:$('start').value,end_date:$('end').value,resolution:$('resolution').value};if($('mode').value==='address'){p.address=$('address').value.trim();if($('city').value.trim())p.city=$('city').value.trim();}else{p.longitude=Number($('longitude').value);p.latitude=Number($('latitude').value);}return p;}
function show(data){current=data;$('raw').textContent=JSON.stringify(data,null,2);$('result').hidden=false;$('empty').hidden=true;const q=data.quality||{},source=data.sources||{};const meta=$('meta');meta.replaceChildren();for(const text of [`查询位置：${data.location?.address||'输入经纬度'}；返回 ${data.data?.length||0} 条记录`,`完整性：${q.time_series_complete?'时间序列完整':'时间序列不完整'}，${q.hours??'—'} / ${q.expected_hours??'—'} 小时；阵风有效 ${q.wind_gust_non_null_hours??'—'} 小时`,`风雨雪来源：${source.wind_rain_snowfall?.model||'—'}；地面积雪来源：${source.ground_snow_depth?.model||'—'}（${source.ground_snow_depth?.status==='available'?'已取得':'未取得'}）`,`冰雹：${data.hail?.status==='unavailable'?'暂无可信事件或直径数据源':'请查看原始响应'}`]){const p=document.createElement('div');p.textContent=text;meta.append(p);}const rows=data.data||[];const keys=rows.length?Object.keys(rows[0]).filter(k=>k!=='valid_hours'&&k!=='date'):[];const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');for(const key of keys){const th=document.createElement('th');th.textContent=labels[key]||key;tr.append(th);}head.append(tr);t.append(head);const body=document.createElement('tbody');for(const row of rows.slice(0,1000)){const tr=document.createElement('tr');for(const key of keys){const td=document.createElement('td');td.textContent=row[key]===null?'缺测':row[key]??'—';tr.append(td);}body.append(tr);}t.append(body);$('table').replaceChildren(t);$('rowCount').textContent=rows.length>1000?`共 ${rows.length} 条，表格展示前 1000 条，JSON 含全部数据`:`共 ${rows.length} 条`;}
$('mode').onchange=mode;
$('example').onclick=()=>{$('mode').value='coordinates';$('longitude').value=116.06;$('latitude').value=36.24;$('start').value='2024-01-01';$('end').value='2024-01-07';$('resolution').value='daily';mode();};
$('queryForm').onsubmit=async event=>{event.preventDefault();const p=payload();$('request').textContent='POST /api/v1/weather/history\n'+JSON.stringify(p,null,2);if(p.start_date>p.end_date||((Date.parse(p.end_date)-Date.parse(p.start_date))/86400000)>365){$('status').textContent='请检查日期：结束日期不得早于开始日期，单次最多 366 天。';$('status').className='message error';return;}$('submit').disabled=true;$('status').className='message';$('status').textContent='正在查询历史数据，请稍候…';try{const headers={'Content-Type':'application/json'};if($('token').value.trim())headers.Authorization='Bearer '+$('token').value.trim();const response=await fetch('/api/v1/weather/history',{method:'POST',headers,body:JSON.stringify(p)});const data=await response.json();if(!response.ok){const detail=Array.isArray(data.detail)?data.detail.map(x=>x.msg).join('；'):data.detail;const message=detail==='Address lookup is not configured; provide WGS84 coordinates'?'尚未配置高德地址解析密钥 PV_AMAP_WEB_KEY。请先配置密钥，或改用 WGS84 经纬度查询。':detail==='Address is ambiguous or insufficiently precise; provide WGS84 coordinates'?'地址解析未得到唯一、精确的结果，请补充省市、道路和门牌号。':detail;throw Error(`${response.status}：${message||'查询失败'}`);}show(data);try{await saveRecord(p,data);await refreshHistory();$('status').textContent='查询完成，结果已保存到本浏览器，可在历史记录中查看。';}catch(storageError){$('status').textContent='查询完成，但浏览器保存失败，请下载 JSON 保留数据。';}}catch(error){$('status').textContent=error.message;$('status').className='message error';if(!current){$('empty').hidden=false;$('empty').textContent='查询未成功，请检查输入或服务配置。';}}finally{$('submit').disabled=false;}};
$('download').onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='weather-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};mode();
let historyRecords=[];
function openHistory(){return new Promise((resolve,reject)=>{const request=indexedDB.open('pv-weather-history',1);request.onupgradeneeded=()=>request.result.createObjectStore('queries',{keyPath:'id',autoIncrement:true});request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
async function saveRecord(request,result){const db=await openHistory();try{await new Promise((resolve,reject)=>{const tx=db.transaction('queries','readwrite');tx.objectStore('queries').add({createdAt:new Date().toISOString(),request,result});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{db.close();}}
async function refreshHistory(){const db=await openHistory();try{historyRecords=await new Promise((resolve,reject)=>{const r=db.transaction('queries','readonly').objectStore('queries').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{db.close();}historyRecords.sort((a,b)=>b.id-a.id);$('history').replaceChildren();for(const record of historyRecords){const option=document.createElement('option');option.value=record.id;option.textContent=new Date(record.createdAt).toLocaleString('zh-CN')+' · '+(record.request.address||record.request.longitude+', '+record.request.latitude)+' · '+record.request.start_date+' 至 '+record.request.end_date;$('history').append(option);}if(!historyRecords.length){const option=document.createElement('option');option.textContent='尚无查询记录';$('history').append(option);}}
function restoreRecord(record){if(!record)return;const p=record.request;$('mode').value=p.address?'address':'coordinates';for(const key of ['address','city','longitude','latitude'])if(p[key]!=null)$(key).value=p[key];$('start').value=p.start_date;$('end').value=p.end_date;$('resolution').value=p.resolution;mode();show(record.result);$('request').textContent='POST /api/v1/weather/history\n'+JSON.stringify(p,null,2);$('status').className='message';$('status').textContent='正在查看已保存结果：'+new Date(record.createdAt).toLocaleString('zh-CN');}
$('history').onchange=()=>restoreRecord(historyRecords.find(r=>String(r.id)===$('history').value));
(async()=>{try{await refreshHistory();restoreRecord(historyRecords[0]);}catch(error){$('status').textContent='本地历史读取失败；仍可查询并下载 JSON。';}})();
</script></body></html>
